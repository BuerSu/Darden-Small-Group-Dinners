<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Darden Small Group Dinners - Browse Dinners</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            darden: {
              orange: '#E57200',
              navy: '#002F6C',
              lightOrange: '#FFF4E6',
              darkOrange: '#C45D00',
              softNavy: '#1A437E'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="h-full text-slate-800 antialiased flex flex-col font-sans">

  <!-- Main Navigation Header -->
  <header class="bg-darden-navy text-white shadow-md sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 bg-darden-orange text-white rounded-lg flex items-center justify-center font-bold text-lg shadow-sm">
          D
        </div>
        <div>
          <h1 class="font-bold text-base sm:text-lg leading-tight tracking-tight">Darden Small Group Dinners</h1>
          <p class="text-xs text-slate-300 font-light">Find a Dinner to Join</p>
        </div>
      </div>

      <div class="flex items-center space-x-3">
        <span class="hidden sm:inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-sky-500/20 text-sky-200 border border-sky-500/30">
          <span class="w-1.5 h-1.5 rounded-full bg-sky-400 mr-1.5"></span>
          Participant View
        </span>
        <button onclick="resetToDefaults()" class="text-xs text-slate-300 hover:text-white underline px-2 py-1 transition">
          Reset Demo Data
        </button>
      </div>
    </div>
  </header>

  <!-- Notification Banner Container -->
  <div id="toastContainer" class="fixed top-20 right-4 z-50 flex flex-col space-y-2 pointer-events-none max-w-sm w-full"></div>

  <!-- Main Workspace -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">

      <!-- COLUMN 1: Story 4 - Filters -->
      <section class="lg:col-span-4 bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden lg:sticky lg:top-24">
        <div class="bg-slate-50 p-4 border-b border-slate-200 flex items-center justify-between">
          <div class="flex items-center space-x-2">
            <svg class="w-5 h-5 text-darden-orange" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path></svg>
            <h2 class="font-bold text-slate-800 text-base">Filter Dinners</h2>
          </div>
          <span class="text-xs text-slate-500 font-medium">User Story 4</span>
        </div>

        <div class="p-5 space-y-4">

          <!-- Theme -->
          <div>
            <label for="themeFilter" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
              Theme / Topic
            </label>
            <input
              type="text"
              id="themeFilter"
              oninput="renderDinners()"
              placeholder="e.g. Career, Case Method"
              class="w-full text-sm rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-darden-orange/50 focus:border-darden-orange transition"
            />
          </div>

          <!-- Location -->
          <div>
            <label for="locationFilter" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
              Location
            </label>
            <select
              id="locationFilter"
              onchange="renderDinners()"
              class="w-full text-sm rounded-lg border border-slate-300 px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-darden-orange/50 focus:border-darden-orange transition"
            >
              <option value="">All locations</option>
              <!-- Populated via JS -->
            </select>
          </div>

          <!-- Date Range -->
          <div>
            <span class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Date</span>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label for="dateFrom" class="block text-[11px] text-slate-500 mb-0.5">From</label>
                <input
                  type="date"
                  id="dateFrom"
                  onchange="renderDinners()"
                  class="w-full text-sm rounded-lg border border-slate-300 px-2 py-2 focus:outline-none focus:ring-2 focus:ring-darden-orange/50 focus:border-darden-orange transition"
                />
              </div>
              <div>
                <label for="dateTo" class="block text-[11px] text-slate-500 mb-0.5">To</label>
                <input
                  type="date"
                  id="dateTo"
                  onchange="renderDinners()"
                  class="w-full text-sm rounded-lg border border-slate-300 px-2 py-2 focus:outline-none focus:ring-2 focus:ring-darden-orange/50 focus:border-darden-orange transition"
                />
              </div>
            </div>
            <p id="dateRangeError" class="hidden text-xs text-red-600 font-medium mt-1">"From" date must be on or before the "To" date.</p>
          </div>

          <!-- Time of Day -->
          <div>
            <label for="timeFilter" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
              Time
            </label>
            <select
              id="timeFilter"
              onchange="renderDinners()"
              class="w-full text-sm rounded-lg border border-slate-300 px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-darden-orange/50 focus:border-darden-orange transition"
            >
              <option value="any">Any time</option>
              <option value="early">Before 6:00 PM</option>
              <option value="evening">6:00 PM – 7:59 PM</option>
              <option value="late">8:00 PM or later</option>
            </select>
          </div>

          <!-- Include full dinners -->
          <label class="flex items-center space-x-2 text-xs text-slate-600 cursor-pointer select-none">
            <input type="checkbox" id="showFull" onchange="renderDinners()" class="rounded border-slate-300 text-darden-orange focus:ring-darden-orange/50" />
            <span>Also show dinners that are already full</span>
          </label>

          <div class="pt-2">
            <button
              onclick="clearFilters()"
              class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-2 px-4 rounded-lg transition text-sm"
            >
              Clear Filters
            </button>
          </div>
        </div>
      </section>

      <!-- COLUMN 2: Story 4 - Available Dinners List -->
      <section class="lg:col-span-8 bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="bg-slate-50 p-4 border-b border-slate-200 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
          <div>
            <div class="flex items-center space-x-2">
              <svg class="w-5 h-5 text-darden-navy" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
              <h2 class="font-bold text-slate-800 text-base">Available Dinners</h2>
            </div>
            <p class="text-xs text-slate-500 mt-0.5">Upcoming dinners, soonest first</p>
          </div>
          <span id="resultCount" class="text-xs font-medium text-slate-500"></span>
        </div>

        <!-- Dynamic Dinners Container -->
        <div id="dinnersContainer" class="p-5 space-y-4">
          <!-- Rendered via JS -->
        </div>
      </section>

    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-white border-t border-slate-200 mt-auto py-4 text-center text-xs text-slate-500">
    <p>Darden School of Business — Small Group Dinner Platform Assignment Demo</p>
  </footer>

  <!-- Application Logic -->
  <script>
    // Shared event store. Uses the same event shape as Creating-a-dinner-event.html
    // ({ id, theme, dateTime, location, capacity, filled, dietary }) and is saved in
    // localStorage so sign-ups made on Signing-up-for-a-dinner.html show up here.
    const STORAGE_KEY = 'darden-sgd-events';

    const defaultEvents = [
      {
        id: 101,
        theme: "Tech & Strategy Career Paths",
        dateTime: "2026-11-12T19:00",
        location: "Pavilion IX, West Lawn",
        capacity: 6,
        filled: 4,
        dietary: "Gluten-Free & Vegetarian friendly options"
      },
      {
        id: 102,
        theme: "Navigating Case Method & Cold Calls",
        dateTime: "2026-11-15T18:30",
        location: "Ivy Road Apartments Common Room",
        capacity: 5,
        filled: 5,
        dietary: "Nut allergy in group"
      },
      {
        id: 103,
        theme: "International Student Connections",
        dateTime: "2026-11-18T19:30",
        location: "North Grounds Apartment Clubhouse",
        capacity: 6,
        filled: 2,
        dietary: "Halal options provided"
      },
      {
        id: 104,
        theme: "Consulting Recruiting: Lessons from SYs",
        dateTime: "2026-11-20T18:00",
        location: "Pavilion IX, West Lawn",
        capacity: 4,
        filled: 1,
        dietary: "None specified"
      },
      {
        id: 105,
        theme: "Entrepreneurship & Startup Ideas",
        dateTime: "2026-12-02T20:00",
        location: "iLab Conference Room",
        capacity: 8,
        filled: 3,
        dietary: "Vegan friendly"
      },
      {
        id: 106,
        theme: "Family Life During the MBA",
        dateTime: "2026-12-05T17:30",
        location: "Ivy Road Apartments Common Room",
        capacity: 6,
        filled: 0,
        dietary: "Kid-friendly menu"
      }
    ];

    let allEvents = loadEvents();

    function loadEvents() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) return JSON.parse(saved);
      } catch (e) {
        // Storage unavailable (private window, blocked site data) - fall back to defaults
      }
      return JSON.parse(JSON.stringify(defaultEvents));
    }

    function saveEvents() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(allEvents));
      } catch (e) {
        // Ignore - data will just not persist across pages
      }
    }

    // Reset Data Helper
    function resetToDefaults() {
      allEvents = JSON.parse(JSON.stringify(defaultEvents));
      saveEvents();
      populateLocations();
      renderDinners();
      showToast('Dinner list reset to initial test data.', 'info');
    }

    function clearFilters() {
      document.getElementById('themeFilter').value = '';
      document.getElementById('locationFilter').value = '';
      document.getElementById('dateFrom').value = '';
      document.getElementById('dateTo').value = '';
      document.getElementById('timeFilter').value = 'any';
      document.getElementById('showFull').checked = false;
      renderDinners();
    }

    // Fill the location dropdown with every distinct location, keeping the current choice
    function populateLocations() {
      const select = document.getElementById('locationFilter');
      const current = select.value;
      const locations = [...new Set(allEvents.map(e => e.location))].sort();

      select.innerHTML = `<option value="">All locations</option>` +
        locations.map(loc => `<option value="${escapeHtml(loc)}">${escapeHtml(loc)}</option>`).join('');
      select.value = locations.includes(current) ? current : '';
    }

    // Time-of-day buckets, by start hour
    function matchesTime(dateTime, bucket) {
      const hour = new Date(dateTime).getHours();
      if (bucket === 'early') return hour < 18;
      if (bucket === 'evening') return hour >= 18 && hour < 20;
      if (bucket === 'late') return hour >= 20;
      return true;
    }

    // Story 4: Filter and render available dinners
    function renderDinners() {
      const container = document.getElementById('dinnersContainer');
      const resultCount = document.getElementById('resultCount');
      const dateRangeError = document.getElementById('dateRangeError');
      const dateFromInput = document.getElementById('dateFrom');
      const dateToInput = document.getElementById('dateTo');

      const themeText = document.getElementById('themeFilter').value.trim().toLowerCase();
      const location = document.getElementById('locationFilter').value;
      const dateFrom = dateFromInput.value; // "YYYY-MM-DD" or ""
      const dateTo = dateToInput.value;
      const timeBucket = document.getElementById('timeFilter').value;
      const showFull = document.getElementById('showFull').checked;

      // Invalid date range: tell the user instead of silently showing nothing
      [dateFromInput, dateToInput].forEach(el => el.classList.remove('border-red-500', 'bg-red-50/30'));
      dateRangeError.classList.add('hidden');
      if (dateFrom && dateTo && dateFrom > dateTo) {
        [dateFromInput, dateToInput].forEach(el => el.classList.add('border-red-500', 'bg-red-50/30'));
        dateRangeError.classList.remove('hidden');
        resultCount.textContent = '';
        container.innerHTML = emptyState(
          'Check your date range',
          'The "From" date is after the "To" date, so no dinner can match. Fix the dates to see results.'
        );
        return;
      }

      const now = new Date();

      const matches = allEvents
        .filter(e => new Date(e.dateTime) > now)                  // upcoming only
        .filter(e => showFull || e.filled < e.capacity)           // open seats unless asked
        .filter(e => !themeText || e.theme.toLowerCase().includes(themeText))
        .filter(e => !location || e.location === location)
        .filter(e => !dateFrom || e.dateTime.slice(0, 10) >= dateFrom)
        .filter(e => !dateTo || e.dateTime.slice(0, 10) <= dateTo)
        .filter(e => matchesTime(e.dateTime, timeBucket))
        .sort((a, b) => new Date(a.dateTime) - new Date(b.dateTime));

      resultCount.textContent = `${matches.length} dinner${matches.length === 1 ? '' : 's'} found`;

      if (matches.length === 0) {
        container.innerHTML = emptyState(
          'No dinners match your filters',
          'Try a different theme, location, or date - or clear the filters to see every open dinner.'
        );
        return;
      }

      container.innerHTML = matches.map(event => {
        const isFull = event.filled >= event.capacity;
        const spotsLeft = event.capacity - event.filled;
        const formattedDate = new Date(event.dateTime).toLocaleString([], {
          weekday: 'short',
          month: 'short',
          day: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        });

        return `
          <div class="border border-slate-200 rounded-xl p-4 bg-white shadow-sm hover:shadow transition space-y-3 ${isFull ? 'opacity-70' : ''}">

            <!-- Top Row: Title & Seats Badge -->
            <div class="flex justify-between items-start gap-2">
              <div>
                <h3 class="font-bold text-slate-900 text-base leading-snug">${escapeHtml(event.theme)}</h3>
                <div class="flex flex-wrap items-center text-xs text-slate-500 gap-y-1 gap-x-3 mt-1">
                  <span class="flex items-center">
                    <svg class="w-3.5 h-3.5 text-slate-400 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    ${escapeHtml(event.location)}
                  </span>
                  <span class="flex items-center">
                    <svg class="w-3.5 h-3.5 text-slate-400 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    ${formattedDate}
                  </span>
                </div>
              </div>

              <div class="text-right flex-shrink-0">
                <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-bold ${
                  isFull
                    ? 'bg-rose-100 text-rose-800 border border-rose-200'
                    : 'bg-emerald-100 text-emerald-800 border border-emerald-200'
                }">
                  <span class="w-1.5 h-1.5 rounded-full ${isFull ? 'bg-rose-500' : 'bg-emerald-500'} mr-1.5"></span>
                  ${isFull ? 'Full' : `${spotsLeft} spot${spotsLeft === 1 ? '' : 's'} left`}
                </span>
              </div>
            </div>

            <!-- Host's Dietary Notes -->
            ${event.dietary && event.dietary !== 'None specified' ? `
              <div class="bg-amber-50 border border-amber-200/70 text-amber-900 rounded-lg p-2 text-xs flex items-start space-x-1.5">
                <svg class="w-3.5 h-3.5 text-amber-600 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <div>
                  <strong class="font-semibold text-amber-800">Dietary Notes:</strong> ${escapeHtml(event.dietary)}
                </div>
              </div>
            ` : ''}

            <!-- Action Row -->
            <div class="pt-2 border-t border-slate-100 flex items-center justify-between">
              <span class="text-[11px] font-medium text-slate-400 uppercase tracking-wider">${event.filled} / ${event.capacity} signed up</span>
              ${isFull ? `
                <span class="px-3 py-1.5 text-xs font-semibold rounded bg-slate-100 text-slate-400 cursor-not-allowed">Dinner Full</span>
              ` : `
                <a
                  href="Signing-up-for-a-dinner.html?event=${event.id}"
                  class="px-3 py-1.5 text-xs font-semibold rounded bg-darden-orange text-white hover:bg-darden-darkOrange transition"
                >
                  Sign Up
                </a>
              `}
            </div>

          </div>
        `;
      }).join('');
    }

    function emptyState(title, detail) {
      return `
        <div class="text-center py-10 border-2 border-dashed border-slate-200 rounded-xl">
          <svg class="w-10 h-10 text-slate-300 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
          <p class="text-sm font-medium text-slate-600">${escapeHtml(title)}</p>
          <p class="text-xs text-slate-400 mt-1">${escapeHtml(detail)}</p>
        </div>
      `;
    }

    // Custom Toast Notification System (Replaces alert())
    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `pointer-events-auto flex items-center justify-between p-3.5 rounded-lg shadow-lg text-xs font-medium border text-white transition-all transform duration-300 translate-y-2 opacity-0 ${
        type === 'success' ? 'bg-emerald-600 border-emerald-500' :
        type === 'error' ? 'bg-rose-600 border-rose-500' :
        'bg-slate-800 border-slate-700'
      }`;

      toast.innerHTML = `
        <div class="flex items-center space-x-2">
          <span>${escapeHtml(message)}</span>
        </div>
        <button onclick="this.parentElement.remove()" class="ml-3 text-white/70 hover:text-white">✕</button>
      `;

      container.appendChild(toast);

      // Animate In
      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
      });

      // Auto dismiss
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    // Security HTML Escaper
    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // Render on boot, and again when returning via the Back button so seat counts are fresh
    window.addEventListener('pageshow', function() {
      allEvents = loadEvents();
      populateLocations();
      renderDinners();
    });
  </script>
</body>
</html>
