<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Darden Dinners | Hosted events</title>
<style>:root{font-family:Calibri,Arial,sans-serif;color:#232D4B;background:#f7f8fa}*{box-sizing:border-box}body{margin:0}header{background:#232D4B;color:#fff;padding:22px max(22px,calc((100% - 900px)/2));font-size:22px;font-weight:700}main{max-width:900px;margin:32px auto;padding:0 20px}.card{background:#fff;border:1px solid #dce2ea;border-radius:12px;padding:24px;margin:16px 0;box-shadow:0 3px 14px #232d4b0a}.eyebrow{font-weight:700;color:#E57200;font-size:13px;letter-spacing:.06em}h1{margin:12px 0 24px}h2{margin:0 0 10px;font-size:20px}p{line-height:1.5}.muted{color:#58657b}.row{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.badge{font-size:13px;border-radius:99px;background:#f2e7d6;padding:6px 11px;font-weight:700}.done{background:#e1f2e8}.upcoming{background:#e8edf5}.btn{font:inherit;border:0;border-radius:7px;padding:11px 16px;cursor:pointer;font-weight:700}.primary{background:#E57200;color:white}.secondary{background:#e9edf4;color:#232D4B}.btn:disabled{opacity:.55;cursor:not-allowed}.guest{display:flex;align-items:center;justify-content:space-between;gap:15px;border-bottom:1px solid #e4e8ee;padding:14px 0;flex-wrap:wrap}select{font:inherit;padding:9px;border:1px solid #9ca8b8;border-radius:6px;min-width:170px}.notice{padding:12px;background:#f1f5fa;border-radius:7px;margin:15px 0}#error{color:#a12b24}#success{color:#17643d}button:focus-visible,select:focus-visible{outline:3px solid #E57200;outline-offset:2px}[hidden]{display:none!important}</style></head>
<body><header>Small Group Dinners @ Darden</header><main><section id="events"><div class="eyebrow">HOST PORTAL</div><h1>My hosted dinners</h1><div id="eventList"></div><button class="btn secondary" id="reset">Reset demo</button></section><section id="checkin" hidden><button class="btn secondary" id="back">← Back to hosted dinners</button><div class="card"><div class="eyebrow">GUEST CHECK-IN</div><h1>Complete dinner check-in</h1><h2>Conversations Beyond the Classroom</h2><p class="muted">November 17, 2026 · 6:30 PM · 4 registered guests</p><p>Mark each registered guest as present or absent, then submit the attendance record.</p><div id="guestList"></div><p id="error" role="alert"></p><p id="success" role="status"></p><button class="btn primary" id="submit">Submit check-in</button></div></section></main>
<script>
'use strict';
const KEY='darden-story9-checkin';
const guests=[{id:'g1',name:'Alex Morgan'},{id:'g2',name:'Jordan Lee'},{id:'g3',name:'Taylor Kim'},{id:'g4',name:'Casey Patel'}];
const events=[{id:'d1',name:'Conversations Beyond the Classroom',date:'November 17, 2026 · 6:30 PM',count:4,status:'past'},{id:'d2',name:'Leadership & Career Conversations',date:'December 3, 2026 · 7:00 PM',count:3,status:'upcoming'},{id:'d3',name:'Global Perspectives Dinner',date:'November 12, 2026 · 6:00 PM',count:5,status:'complete'}];
const el=id=>document.getElementById(id);
function saved(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch{return null}}
function show(which){el('events').hidden=which!=='events';el('checkin').hidden=which!=='checkin';if(which==='checkin')renderCheckin()}
function renderEvents(){const root=el('eventList');root.replaceChildren();events.forEach(e=>{const completed=e.status==='complete'||(e.id==='d1'&&!!saved());const label=completed?'Check-in complete':e.status==='upcoming'?'Upcoming':'Check-in pending';const card=document.createElement('article');card.className='card';const top=document.createElement('div');top.className='row';const heading=document.createElement('h2');heading.textContent=e.name;const badge=document.createElement('span');badge.className='badge '+(completed?'done':e.status==='upcoming'?'upcoming':'');badge.textContent=label;top.append(heading,badge);const meta=document.createElement('p');meta.className='muted';meta.textContent=`${e.date} · ${e.count} registered guests`;card.append(top,meta);if(e.id==='d1'&&!completed){const btn=document.createElement('button');btn.className='btn primary';btn.textContent='Check in guests';btn.addEventListener('click',()=>show('checkin'));card.append(btn)}else if(e.status==='upcoming'){const note=document.createElement('p');note.className='muted';note.textContent='Check-in becomes available after the dinner ends.';card.append(note)}root.append(card)})}
function renderCheckin(){const root=el('guestList');root.replaceChildren();const record=saved();guests.forEach(g=>{const row=document.createElement('div');row.className='guest';const label=document.createElement('label');label.textContent=g.name;label.htmlFor='attendance-'+g.id;const sel=document.createElement('select');sel.id='attendance-'+g.id;sel.dataset.id=g.id;[['','Select attendance'],['present','Present'],['absent','Absent']].forEach(([value,text])=>{const option=document.createElement('option');option.value=value;option.textContent=text;sel.append(option)});if(record)sel.value=record[g.id];sel.disabled=!!record;row.append(label,sel);root.append(row)});el('submit').disabled=!!record;el('error').textContent='';el('success').textContent=record?'Attendance submitted successfully.':''}
el('submit').addEventListener('click',()=>{const entries=[...el('guestList').querySelectorAll('select')].map(s=>[s.dataset.id,s.value]);if(entries.some(([,v])=>!v)){el('error').textContent='Please mark every guest as Present or Absent before submitting.';return}try{localStorage.setItem(KEY,JSON.stringify(Object.fromEntries(entries)));renderCheckin();renderEvents()}catch{el('error').textContent='Unable to save attendance. Please try again.'}});
el('back').addEventListener('click',()=>{renderEvents();show('events')});el('reset').addEventListener('click',()=>{localStorage.removeItem(KEY);renderEvents();show('events')});renderEvents();
</script></body></html>
